name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Python smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile packages and scripts
        run: python -m compileall -q fsot_lib fsot_quantum scripts verification
      - name: Import packages
        run: python -c "import fsot_lib, fsot_quantum; print('imports ok')"
      - name: CLI help
        run: python -m fsot_quantum
